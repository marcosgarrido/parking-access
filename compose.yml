name: parking-access

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: parking-access-mediamtx
    env_file:
      - .env
    ports:
      - "8189:8189/udp"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: parking-access-mosquitto
    env_file:
      - .env
    command: sh -c "mosquitto_passwd -b -c /mosquitto/config/passwd $$MQTT_USER $$MQTT_PASS && mosquitto -c /mosquitto/config/mosquitto.conf"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    restart: unless-stopped

  database:
    image: postgres:18.4
    container_name: parking-access-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: parking-access-server
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
