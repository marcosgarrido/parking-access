services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: parking-access-new-mediamtx
    env_file:
      - ./mediamtx/.env
    ports:
      - "8554:8554"
      - "8189:8189/udp"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: parking-access-new-mosquitto
    env_file:
      - ./mosquitto/.env
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    restart: unless-stopped

  database:
    image: postgres:18.4
    container_name: parking-access-new-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: parking-access-new-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
      - root_node_modules:/app/node_modules
      - backend_node_modules:/app/backend/node_modules
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: parking-access-new-frontend
    volumes:
      - ./frontend:/app/frontend
      - ./packages:/app/packages
      - root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  root_node_modules:
  backend_node_modules:
  frontend_node_modules:
